syntax = "proto3";

package user;

option go_package = "github.com/EryyynIT/workaly/auth-service/pb/userpb";

// Internal profile API. Credentials, sessions and recovery belong to Auth.
// user_id is a stable UUID assigned by Auth at registration; User trusts it
// only from the authenticated internal channel, never from client input.
service UserService {
  // Creates a profile for a freshly registered account. Idempotent by user_id:
  // Auth retries this call when the registration outcome was unknown.
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // Public profile view by user_id: display name and username, nothing else.
  // Contains no credentials or contact data, so any caller may read it.
  // Here user_id is the address of public data, not a proof of identity:
  // no authorization decision may depend on it.
  rpc GetPublicProfile(GetPublicProfileRequest) returns (GetPublicProfileResponse);
}

message CreateProfileRequest {
  string user_id = 1;
  string name = 2;
  string username = 3;
}

message CreateProfileResponse {
  enum Status {
    SUCCESS = 0;
  }
  Status status = 1;
}

message GetPublicProfileRequest {
  string user_id = 1;
}

message GetPublicProfileResponse {
  string name = 1;
  string username = 2;
}
